<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-orbit"/></svg></div>
      <div>
        <div class="brand-name">Everyday Orbit</div>
        <div class="brand-sub" id="brandSub">Personal planner</div>
      </div>
    </div>
    <div class="rail-scroll">
      <nav class="nav" id="nav"></nav>
      <div class="rail-head" id="railHead"></div>
      <div id="catList"></div>
    </div>
    <div class="rail-foot">
      <div class="sync" id="sync"><span class="dot"></span><span>Saved</span></div>
      <div class="spacer" style="flex:1"></div>
      <button class="foot-btn" data-act="export" title="Back up everything to a file" aria-label="Back up to a file"><svg class="ic ic-14" aria-hidden="true"><use href="#i-download"/></svg></button>
      <button class="foot-btn" data-act="import" title="Restore from a backup file" aria-label="Restore from a backup file"><svg class="ic ic-14" aria-hidden="true"><use href="#i-upload"/></svg></button>
      <button class="foot-btn" data-act="settings" title="Settings" aria-label="Settings"><svg class="ic ic-14" aria-hidden="true"><use href="#i-settings"/></svg></button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="viewport" id="viewport"></div>
  </div>
</div>
<button class="rail-scrim" data-act="rail" aria-label="Close the sidebar" tabindex="-1"></button>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
